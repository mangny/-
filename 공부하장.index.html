<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC / MCT G코드 연습 앱</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --primary: #2563eb;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --incorrect-bg: #fecaca;
            --guide-color: #94a3b8;
            --comment-color: #d97706;
            --comment-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
        }

        header {
            text-align: center;
            padding: 0.5rem 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .mode-btn {
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 0.5rem;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
        }

        .step-header {
            background: #e0f2fe;
            border: 1px solid #7dd3fc;
            color: #0369a1;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .editor-container {
            position: relative;
            width: 100%;
            min-height: 480px;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            background-color: #ffffff;
        }

        .editor-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            font-family: 'Courier New', Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #guide-layer {
            pointer-events: none;
            z-index: 1;
            color: var(--guide-color);
            opacity: 0.45;
        }

        #display-layer {
            pointer-events: none;
            z-index: 2;
        }

        #real-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            line-height: 1.6;
            font-family: 'Courier New', Consolas, monospace;
            color: transparent;
            background: transparent;
            caret-color: #000000;
            border: none;
            outline: none;
            resize: none;
            z-index: 3;
            white-space: pre-wrap;
            word-break: break-all;
            overflow: hidden;
        }

        .char-correct {
            color: var(--correct);
            font-weight: bold;
            background-color: rgba(220, 252, 231, 0.7);
        }

        .char-incorrect {
            color: var(--incorrect);
            background-color: var(--incorrect-bg);
            font-weight: bold;
            border-radius: 2px;
        }

        .comment-line {
            color: var(--comment-color);
            background-color: var(--comment-bg);
            font-weight: bold;
            padding: 0 4px;
            border-radius: 4px;
            display: inline-block;
            margin: 1px 0;
        }

        .metrics-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 0.5rem 0;
            border-top: 1px solid #f1f5f9;
        }

        .metric-item {
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background-color: #cbd5e1;
            border-radius: 12px;
            transition: background-color 0.2s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        input[type="checkbox"]:checked + .toggle-switch {
            background-color: var(--primary);
        }

        input[type="checkbox"]:checked + .toggle-switch::after {
            transform: translateX(20px);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #e2e8f0;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .toast-popup {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 1.25rem 2rem;
            border-radius: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 2px solid #38bdf8;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease-out;
            text-align: center;
        }

        .toast-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CNC / MCT G코드 연습 앱</h1>
        <div class="mode-selector">
            <button class="mode-btn active" id="mode-cnc-btn">CNC 선반</button>
            <button class="mode-btn" id="mode-mct-btn">MCT 밀링</button>
        </div>
    </header>

    <div class="step-header">
        <span id="step-title">[1단계]</span>
        <span id="step-index" style="font-size: 0.85rem; opacity: 0.8;">1 / 4 단계</span>
    </div>

    <div class="card">
        <div class="editor-container" id="editor-container">
            <div id="guide-layer" class="editor-layer"></div>
            <div id="display-layer" class="editor-layer"></div>
            <textarea id="real-input" spellcheck="false" autocomplete="off"></textarea>
        </div>

        <div class="metrics-row">
            <div class="metric-item">
                <div class="metric-label">ACCURACY</div>
                <div class="metric-value" id="accuracy-val">100%</div>
            </div>
            <div style="width: 1px; height: 24px; background: #e2e8f0;"></div>
            <div class="metric-item">
                <div class="metric-label">LINE PROGRESS</div>
                <div class="metric-value" id="progress-val">0 / 0 줄</div>
            </div>
        </div>

        <div class="controls-row">
            <label class="toggle-group">
                <input type="checkbox" id="toggle-guide" checked style="display: none;">
                <div class="toggle-switch"></div>
                <span>Show Target Text (원문 보이기)</span>
            </label>

            <div class="btn-group">
                <button class="btn" id="prev-step-btn">← 이전 단계</button>
                <button class="btn" id="reset-btn">Reset</button>
                <button class="btn btn-primary" id="next-step-btn">다음 단계 →</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast-popup"></div>

<script>
    const cncSteps = [
        {
            title: "[1단계] 후면황삭 및 모따기가공",
            codeLines: [
                "%", "O0000", "G50 S2000 T0400", "G96 S200 M03", "G00 X55. Z10. T0404 M08",
                "G71 U1.0 R1.0", "G71 P10 Q20 U0.2 W0.2 F0.2", "N10 G00 X-1.6", "G01 Z0.",
                "X.", "X49. Z.", "Z-50.", "N20 G01 U1.0", "G70 P10 Q20 F0.07",
                "G00 X150. Z150. T0400 M09", "M05", "M01"
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[2단계] 홈가공",
            codeLines: [
                "G50 S1000 T0500", "G97 S450 M03", "G00 X55. Z. T0505 M08", "G01 X. F0.05",
                "G04 P1000", "G00 X55.", "W.", "G01 X.", "G04 P1000", "G00 X55.",
                "G00 X150. Z150. T0500 M09", "M05", "M01"
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[3단계] 황삭 및 정삭가공",
            codeLines: [
                "G50 S2000 T0400", "G96 S200 M03", "G00 X55. Z10. T0400 M08", "G71 U1.0 R1.0",
                "G71 P30 Q40 U0.2 W0.2 F0.2", "N30 G00 X-1.6", "G01 Z0.",
                "(도면에 따라 프로그램 작성)",
                "N40 G01 U1.0", "G70 P30 Q40 F0.07", "G00 X150. Z150. T0400 M09", "M05", "M01"
            ],
            isCommentLine: [false, false, false, false, false, false, false, true, false, false, false, false, false],
            startNotice: "💡 유의사항: \"공작물을 돌려 물림.\"",
            completionNotice: ""
        },
        {
            title: "[4단계] 나사가공",
            codeLines: [
                "G50 S1000 T0700", "G97 S450 M03", "G00 X . Z . T0707 M08", "G92. X. Z. F.",
                "X.", "X.", "G00 X150.Z150.T0700 M09", "M05", "M02", "M30", "%"
            ],
            isCommentLine: [],
            startNotice: "💡 유의사항: \"후면부 홈가공\"",
            completionNotice: "🎉 모든 단계 연습을 끝마쳤습니다!"
        }
    ];

    const mctSteps = [
        {
            title: "[1단계] 초기 세팅",
            codeLines: [
                "%", "O0000", "G40 G49 G80", "G91 G28 X0. Y0. Z0.", "G90 G54 G00 X0. Y0. Z100."
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[2단계] 센터드릴",
            codeLines: [
                "T03 M06 G90 G00 X. Y.", "S800 M03", "G43 H03", "G43 H03 Z100.", "Z30. M08",
                "G81 G99 Z-2. F80 R5.", "G80 G00 Z50. M09", "G49 Z100. M05", "M19"
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[3단계] 팩드릴",
            codeLines: [
                "T06 M06", "G90 G00 X. Y.", "S800 M03", "G43 H06 Z100.", "Z30. M08",
                "G83 G99 Z-30 F80 R5. Q5.", "G80 G00 Z50. M09", "G49 Z100. M05", "M19"
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[4단계] 탭가공",
            codeLines: [
                "T07 M06", "G90 G00 X. Y.", "S400 M03", "G43 H07 Z100.", "Z30. M08",
                "G84 G99 Z-30. F500 R5. Q5.", "G80 G00 Z50. M09", "G49 Z100. M05", "M19"
            ],
            isCommentLine: [],
            completionNotice: ""
        },
        {
            title: "[5단계] 윤곽가공",
            codeLines: [
                "T01 M06", "G90 G00 X-10. Y-10.", "S1000 M03", "G43 H01 Z100.", "Z30. M08",
                "G01 Z. F100", "G41 D01 X.",
                "(도면에 따라 프로그램 작성)",
                "N40 G00 Z50. M09", "G49 Z100. M05", "M02", "%"
            ],
            isCommentLine: [false, false, false, false, false, false, false, true, false, false, false, false],
            completionNotice: "🎉 MCT 밀링 연습 과정을 완료했습니다!"
        }
    ];

    let currentMode = 'CNC';
    let stepsData = cncSteps;
    let cncUserInputs = ["", "", "", ""];
    let mctUserInputs = ["", "", "", "", ""];
    let userInputs = cncUserInputs;
    let currentStepIdx = 0;

    const modeCncBtn = document.getElementById('mode-cnc-btn');
    const modeMctBtn = document.getElementById('mode-mct-btn');
    const stepTitleEl = document.getElementById('step-title');
    const stepIndexEl = document.getElementById('step-index');
    const guideLayer = document.getElementById('guide-layer');
    const displayLayer = document.getElementById('display-layer');
    const realInput = document.getElementById('real-input');
    const editorContainer = document.getElementById('editor-container');
    const accuracyVal = document.getElementById('accuracy-val');
    const progressVal = document.getElementById('progress-val');
    const toggleGuide = document.getElementById('toggle-guide');
    const resetBtn = document.getElementById('reset-btn');
    const prevStepBtn = document.getElementById('prev-step-btn');
    const nextStepBtn = document.getElementById('next-step-btn');
    const toast = document.getElementById('toast');

    function switchMode(mode) {
        currentMode = mode;
        if (mode === 'CNC') {
            stepsData = cncSteps;
            userInputs = cncUserInputs;
            modeCncBtn.classList.add('active');
            modeMctBtn.classList.remove('active');
        } else {
            stepsData = mctSteps;
            userInputs = mctUserInputs;
            modeMctBtn.classList.add('active');
            modeCncBtn.classList.remove('active');
        }
        loadStep(0);
    }

    function adjustContainerHeight() {
        const lineCount = stepsData[currentStepIdx].codeLines.length;
        const calculatedHeight = Math.max(480, lineCount * 31 + 40);
        editorContainer.style.height = `${calculatedHeight}px`;
    }

    function loadStep(stepIdx) {
        currentStepIdx = stepIdx;
        const step = stepsData[currentStepIdx];

        stepTitleEl.textContent = step.title;
        stepIndexEl.textContent = `${currentStepIdx + 1} / ${stepsData.length} 단계`;
        
        realInput.value = userInputs[currentStepIdx] || '';

        adjustContainerHeight();
        updateRender();
        realInput.focus();

        if (step.startNotice) {
            showToast(step.startNotice);
        }
    }

    function showToast(message) {
        if (!message) return;
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    }

    function goToNextStep() {
        const step = stepsData[currentStepIdx];
        
        if (currentStepIdx === stepsData.length - 1) {
            showToast("🎉 모든 단계 연습을 완벽히 마쳤습니다!");
            return;
        }

        if (step.completionNotice) {
            showToast(step.completionNotice);
        }

        setTimeout(() => {
            if (currentStepIdx < stepsData.length - 1) {
                loadStep(currentStepIdx + 1);
            }
        }, step.completionNotice ? 1200 : 100);
    }

    function updateRender() {
        userInputs[currentStepIdx] = realInput.value;

        const step = stepsData[currentStepIdx];
        const targetLines = step.codeLines;
        const typedLines = realInput.value.split('\n');

        if (toggleGuide.checked) {
            guideLayer.style.display = 'block';
            let guideHTML = '';
            for (let i = 0; i < targetLines.length; i++) {
                if (step.isCommentLine && step.isCommentLine[i]) {
                    guideHTML += `<span class="comment-line">${escapeHTML(targetLines[i])}</span>\n`;
                } else {
                    guideHTML += escapeHTML(targetLines[i]) + '\n';
                }
            }
            guideLayer.innerHTML = guideHTML;
        } else {
            guideLayer.style.display = 'none';
        }

        let displayHTML = '';
        let totalTypedChars = 0;
        let totalCorrectChars = 0;

        let typedIdx = 0;
        let targetIdx = 0;

        while (targetIdx < targetLines.length) {
            if (step.isCommentLine && step.isCommentLine[targetIdx]) {
                displayHTML += `<span class="comment-line">${escapeHTML(targetLines[targetIdx])}</span>\n`;
                targetIdx++;
                continue;
            }

            const rawTypedLine = typedLines[typedIdx] !== undefined ? typedLines[typedIdx] : '';
            const targetLine = targetLines[targetIdx];

            if (typedIdx < typedLines.length) {
                let cleanTyped = rawTypedLine.replace(/\s+/g, '').toUpperCase();
                let cleanTarget = targetLine.replace(/\s+/g, '').toUpperCase();

                if (cleanTyped.length > 0) {
                    for (let i = 0; i < rawTypedLine.length; i++) {
                        totalTypedChars++;
                        const typedChar = rawTypedLine[i];
                        
                        let charCleanTyped = rawTypedLine.slice(0, i + 1).replace(/\s+/g, '').toUpperCase();
                        let charCleanTarget = cleanTarget.slice(0, charCleanTyped.length);

                        if (charCleanTyped === charCleanTarget) {
                            displayHTML += `<span class="char-correct">${escapeHTML(typedChar)}</span>`;
                            totalCorrectChars++;
                        } else {
                            displayHTML += `<span class="char-incorrect">${escapeHTML(typedChar)}</span>`;
                        }
                    }
                }
                displayHTML += '\n';
                typedIdx++;
            } else {
                displayHTML += '\n';
            }

            targetIdx++;
        }

        displayLayer.innerHTML = displayHTML;

        const accuracy = totalTypedChars > 0 ? Math.round((totalCorrectChars / totalTypedChars) * 100) : 100;
        const pureTargetLinesCount = step.isCommentLine ? targetLines.filter((_, idx) => !step.isCommentLine[idx]).length : targetLines.length;

        accuracyVal.textContent = `${accuracy}%`;
        progressVal.textContent = `${Math.min(typedLines.length, pureTargetLinesCount)} / ${pureTargetLinesCount} 줄`;
    }

    // 부분 입력 상태에서도 정답 가이드에 맞춰 자동 띄어쓰기 복원
    realInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();

            const step = stepsData[currentStepIdx];
            const typedLines = realInput.value.split('\n');

            const currentLineIdx = typedLines.length - 1;
            let actualTargetIdx = 0;
            let nonCommentCount = 0;

            for (let i = 0; i < step.codeLines.length; i++) {
                if (step.isCommentLine && step.isCommentLine[i]) continue;
                if (nonCommentCount === currentLineIdx) {
                    actualTargetIdx = i;
                    break;
                }
                nonCommentCount++;
            }

            const targetLine = step.codeLines[actualTargetIdx];
            if (targetLine) {
                const cleanTyped = typedLines[currentLineIdx].replace(/\s+/g, '').toUpperCase();
                
                // 일부만 입력해도 정답 템플릿 위치에 맞게 띄어쓰기 자동 삽입
                let formattedResult = '';
                let typedPos = 0;

                for (let i = 0; i < targetLine.length && typedPos < cleanTyped.length; i++) {
                    const tChar = targetLine[i];
                    if (tChar === ' ') {
                        formattedResult += ' ';
                    } else {
                        formattedResult += cleanTyped[typedPos];
                        typedPos++;
                    }
                }

                // 남은 입력이 있다면 끝에 붙여주기
                if (typedPos < cleanTyped.length) {
                    formattedResult += cleanTyped.slice(typedPos);
                }

                typedLines[currentLineIdx] = formattedResult;
            }

            typedLines.push('');
            realInput.value = typedLines.join('\n');
            updateRender();

            const pureTargetLinesCount = step.isCommentLine ? step.codeLines.filter((_, idx) => !step.isCommentLine[idx]).length : step.codeLines.length;

            if (typedLines.length - 1 >= pureTargetLinesCount) {
                goToNextStep();
            }
        }
    });

    function escapeHTML(str) {
        if (!str) return '';
        if (str === '\n') return '\n';
        if (str === ' ') return ' ';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    realInput.addEventListener('input', updateRender);
    toggleGuide.addEventListener('change', updateRender);

    resetBtn.addEventListener('click', () => {
        realInput.value = '';
        userInputs[currentStepIdx] = '';
        updateRender();
        realInput.focus();
    });

    prevStepBtn.addEventListener('click', () => {
        if (currentStepIdx > 0) {
            loadStep(currentStepIdx - 1);
        } else {
            alert('첫 번째 단계입니다.');
        }
    });

    nextStepBtn.addEventListener('click', () => {
        if (currentStepIdx < stepsData.length - 1) {
            loadStep(currentStepIdx + 1);
        } else {
            showToast("🎉 이미 마지막 단계입니다.");
        }
    });

    modeCncBtn.addEventListener('click', () => switchMode('CNC'));
    modeMctBtn.addEventListener('click', () => switchMode('MCT'));

    loadStep(0);
</script>

</body>
</html>
